# PulseAudio daemon configuration for headless operation

# Run as a system-wide daemon (not per-user)
daemonize = yes
allow-module-loading = yes
allow-exit = no
system-instance = yes

# Disable shared memory (not needed in container)
enable-shm = no

# Audio settings
default-sample-format = s16le
default-sample-rate = 48000
default-sample-channels = 2

# Disable suspend on idle
exit-idle-time = -1

# Logging
log-level = info

# Allow anonymous connections
load-default-script-file = yes
default-script-file = /etc/pulse/default.pa
